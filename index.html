<style>
:root{--green:#1f8a45;--green-d:#0b5a3a;--green-l:#2fa84f;--mint:#5fd17c;--ink:#0f1a14;--soft:rgba(15,26,20,.62);--faint:rgba(15,26,20,.08);--bg:#fff;--bg2:#f6f8f7;--deep:#0b3d28}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%;height:auto}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:999px;font-weight:700;font-size:17px;border:0;cursor:pointer;font-family:inherit;transition:background .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(31,138,69,.25)}.btn-p:hover{background:#187339}
.btn-o{background:#fff;border:1px solid rgba(0,0,0,.1)}.btn-o:hover{background:#fafafa}
.btn-sm{height:38px;padding:0 16px;font-size:15px;box-shadow:none}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* header */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--faint)}
.bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo img{width:36px;height:36px;border-radius:10px}.logo b{color:var(--green-l)}
.links{display:flex;gap:24px;margin-inline-start:20px;color:var(--soft);font-size:15px}.links a:hover{color:var(--ink)}
.right{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.lang{height:38px;padding:0 12px;border-radius:999px;border:0;background:none;color:var(--green);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}.lang:hover{background:rgba(31,138,69,.1)}
.burger{display:none;width:40px;height:40px;border-radius:999px;border:0;background:none;cursor:pointer;align-items:center;justify-content:center}
.mnav{display:none;border-top:1px solid var(--faint);padding:8px 16px 14px;background:#fff}.mnav a{display:block;padding:10px 0;font-size:17px}
.mnav.on{display:block}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(#eef8f1,#fff)}
.glow{position:absolute;top:-180px;left:50%;width:560px;height:560px;transform:translateX(-50%);border-radius:50%;background:rgba(47,168,79,.16);filter:blur(70px);pointer-events:none}
.hgrid{position:relative;display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-block:80px 64px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:999px;background:rgba(31,138,69,.1);color:var(--green-d);font-weight:700;font-size:15px}.badge svg{width:17px;height:17px}
h1{margin:20px 0 0;font-size:60px;line-height:1.04;letter-spacing:-.02em;font-weight:800}h1 span{color:var(--green)}
.sub{margin:20px 0 0;max-width:560px;font-size:19px;color:var(--soft)}
.ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.note{margin-top:14px;font-size:15px;color:rgba(15,26,20,.5)}
.shot{position:relative}
.browser{border-radius:18px;overflow:hidden;border:1px solid rgba(0,0,0,.1);background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.12)}
.dots{display:flex;gap:6px;height:28px;align-items:center;padding:0 12px;background:#f2f2f4;direction:ltr}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.phone{border:7px solid var(--ink);border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.shot .phone{position:absolute;bottom:-40px;inset-inline-end:-24px;width:34%}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 34px;padding-block:8px 44px;margin:0 auto;list-style:none;color:var(--soft);font-weight:700;font-size:16px}
.strip li{display:flex;align-items:center;gap:8px}.strip svg{color:var(--green)}
/* sections */
section{padding:84px 0}.alt{background:var(--bg2)}
h2{margin:0;font-size:42px;line-height:1.12;letter-spacing:-.015em;font-weight:800}.c{text-align:center}
.lead{max-width:680px;margin:16px auto 0;font-size:19px;color:var(--soft)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{border:1px solid var(--faint);border-radius:20px;padding:24px;background:#fff;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.06)}
.ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(31,138,69,.1);color:var(--green)}
.card h3{margin:16px 0 0;font-size:19px}.card p{margin:6px 0 0;color:var(--soft)}
.show{display:grid;grid-template-columns:1fr 1.4fr;gap:44px;align-items:center}.show+.show{margin-top:84px}.show.rev>:first-child{order:2}
.show h2{font-size:34px}.show p{margin:16px 0 0;font-size:19px;color:var(--soft)}
.show img{border-radius:18px;border:1px solid rgba(0,0,0,.1);box-shadow:0 22px 50px rgba(0,0,0,.1)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;max-width:960px;margin:0 auto}
.pgrid .phone{width:270px;margin:0 auto;border-width:8px;border-radius:38px;order:2}
.checks{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:16px}.checks li{display:flex;gap:12px;align-items:flex-start;font-size:19px}
.tick{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}.tick svg{width:16px;height:16px;stroke-width:3}
.deep{background:var(--deep);color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
.role{border-radius:20px;padding:24px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}.role svg{color:var(--mint);width:28px;height:28px}
.role h3{margin:16px 0 0;font-size:21px}.role p{margin:8px 0 0;color:rgba(255,255,255,.72)}
.steps{list-style:none;padding:0;margin:48px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:980px}
.steps li{border:1px solid var(--faint);border-radius:20px;padding:24px}.num{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center}
.steps h3{margin:16px 0 0;font-size:21px}.steps p{margin:8px 0 0;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;max-width:980px;margin:0 auto}
.box{border-radius:28px;padding:32px;background:#fff;box-shadow:inset 0 0 0 1px var(--faint)}.box h2{font-size:28px;margin-top:16px}
.box ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}.box li{display:flex;gap:12px;color:var(--soft)}.box li svg{color:var(--green);margin-top:2px;width:20px;height:20px}
.price{background:var(--ink);color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.2)}.price h2{margin-top:0}.price .muted{color:rgba(255,255,255,.66)}
.big{font-size:40px;line-height:1;font-weight:800;color:var(--mint);margin-top:24px}
.price li{color:#fff}.price li svg{color:var(--mint)}
.price .btns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.price .btns .btn{flex:1;min-width:180px}
.btn-g{background:var(--green-l);color:#fff}.btn-g:hover{background:#279544}.btn-w{background:rgba(255,255,255,.1);color:#fff}.btn-w:hover{background:rgba(255,255,255,.16)}
.faq{max-width:780px;margin:40px auto 0;border:1px solid var(--faint);border-radius:20px;overflow:hidden}
.faq details{border-top:1px solid var(--faint)}.faq details:first-child{border-top:0}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;font-weight:700;font-size:18px}
.faq summary::-webkit-details-marker{display:none}.faq summary svg{transition:transform .2s;color:rgba(0,0,0,.4)}.faq details[open] summary svg{transform:rotate(180deg)}
.faq p{margin:0;padding:0 22px 20px;color:var(--soft)}
.final{max-width:980px;margin:0 auto;border-radius:28px;padding:56px 24px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 24px 50px rgba(11,90,58,.25)}
.final p{max-width:560px;margin:12px auto 0;font-size:19px;color:rgba(255,255,255,.82)}.final .btn{margin-top:28px;background:#fff;color:var(--green-d)}
footer{border-top:1px solid var(--faint);padding:28px 0;color:rgba(15,26,20,.55);font-size:15px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.foot .logo{font-size:15px;font-weight:600;color:inherit}.foot .logo img{width:24px;height:24px;border-radius:6px}
.foot a:hover{color:var(--ink)}
.ltr{direction:ltr;unicode-bidi:isolate}
@media (max-width:900px){
  .links,.right .btn{display:none}.burger{display:inline-flex}
  .hgrid,.show,.pgrid,.two{grid-template-columns:1fr}.hgrid{padding-block:44px 60px;gap:56px}
  h1{font-size:42px}h2{font-size:32px}.show h2{font-size:28px}
  .grid3{grid-template-columns:1fr 1fr}.grid4{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}
  .show.rev>:first-child{order:0}.pgrid .phone{order:0}
  .shot .phone{width:38%;inset-inline-end:-6px}
  section{padding:64px 0}
}
@media (max-width:560px){.grid3,.grid4{grid-template-columns:1fr}.ctas .btn{width:100%}h1{font-size:38px}.box{padding:24px}}
